<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        .avatar-thumb {
            width: 48px; height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #dee2e6;
        }
        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; }
        .status-true  { background: #d4edda; color: #155724; }
        .status-false { background: #f8d7da; color: #721c24; }
        th a { color: white; text-decoration: none; }
    </style>
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách linh kiện</h2>
        <a th:href="@{/keyboardParts/create}" class="btn btn-success">Thêm linh kiện</a>
    </div>

    <form th:action="@{/keyboardParts}" method="get" class="mb-4">
        <div class="form-row align-items-end">

            <div class="col-md-3">
                <label class="small font-weight-bold">Tìm theo tên linh kiện</label>
                <input type="text" class="form-control form-control-sm"
                       name="keyword" th:value="${keyword}"/>
            </div>

            <div class="col-md-3">
                <label class="small font-weight-bold">Loại linh kiện</label>
                <select class="form-control form-control-sm" name="categoryId">
                    <option value="">-- Tất cả --</option>
                    <option th:each="dept : ${categories}"
                            th:value="${dept.id}"
                            th:text="${dept.name}"
                            th:selected="${dept.id == categoryId}">
                    </option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary btn-sm btn-block">Lọc</button>
            </div>
            <div class="col-md-2">
                <a th:href="@{/keyboardParts}" class="btn btn-outline-secondary btn-sm btn-block">Xoá lọc</a>
            </div>

        </div>
    </form>

    <p class="text-muted">
        Tìm thấy <strong th:text="${totalItems}"></strong> linh kiện
        <span th:if="${!#strings.isEmpty(keyword)}">
            cho "<strong th:text="${keyword}"></strong>"
        </span>
    </p>

    <table class="table table-bordered table-hover table-striped">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Ảnh linh kiện</th>
            <th>Tên linh kiện</th>
            <th>Nhãn hiệu</th>
            <th>Giá</th>
            <th>Ngày ra mắt</th>
            <th>Loại linh kiện</th>
            <th>Trạng thái</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="kb, stat : ${keyboards}">
            <td th:text="${currentPage * 5 + stat.count}"></td>

            <td>
                <img th:if="${kb.partImage != null and !kb.partImage.isEmpty()}"
                     th:src="@{'/uploads/' + ${kb.partImage}}"
                     class="avatar-thumb" alt="Avatar"/>
                <img th:unless="${kb.partImage != null and !kb.partImage.isEmpty()}"
                     src=""
                     class="avatar-thumb" alt="Chưa có ảnh"/>
            </td>

            <td th:text="${kb.partName}"></td>
            <td th:text="${kb.manufacturer}"></td>
            <td th:text="${kb.price}"></td>
            <td th:text="${kb.releaseDate}"></td>
            <td th:text="${kb.componentCategory != null ? kb.componentCategory.name : 'Chưa phân loại'}"></td>
            <td>
                <span th:class="'status-badge status-' + ${kb.inStock}"
                      th:text="${kb.inStock ? 'Còn hàng' : 'Hết hàng'}"></span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(keyboards)}">
            <td colspan="8" class="text-center text-muted py-4">
                Không tìm thấy linh kiện
                <span th:if="${!#strings.isEmpty(keyword)}">
                    với từ khoá "<strong th:text="${keyword}"></strong>"
                </span>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center flex-wrap">

            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/keyboardParts(keyword=${keyword}, categoryId=${categoryId}, page=${currentPage - 1})}">
                    &laquo; Trước
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage ? 'active' : ''}">
                <a class="page-link"
                   th:href="@{/keyboardParts(keyword=${keyword}, categoryId=${categoryId}, page=${i})}"
                   th:text="${i + 1}">
                </a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/keyboardParts(keyword=${keyword}, categoryId=${categoryId}, page=${currentPage + 1})}">
                    Sau &raquo;
                </a>
            </li>

        </ul>

        <p class="text-center text-muted">
            Trang <strong th:text="${currentPage + 1}"></strong>
            / <strong th:text="${totalPages}"></strong>
        </p>
    </nav>

</div>
</body>
</html>
